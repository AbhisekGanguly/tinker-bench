<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tinkerbench — live preview</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23f1550f'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23fff' font-family='Georgia,serif' font-style='italic' font-weight='bold'>tb</text></svg>">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .strip {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      height: 34px;
      background: #20293a;
      color: #f3edde;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      user-select: none;
    }
    .strip .mark {
      font-family: Georgia, serif;
      font-style: italic;
      font-weight: 700;
      text-transform: none;
      letter-spacing: 0;
      font-size: 13px;
      color: #f1550f;
    }
    .live-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #2fbf71;
      box-shadow: 0 0 0 0 rgba(47, 191, 113, 0.6);
    }
    .live-dot.pulse { animation: pulse 0.9s ease-out; }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(47, 191, 113, 0.6); }
      100% { box-shadow: 0 0 0 9px rgba(47, 191, 113, 0); }
    }
    .status { opacity: 0.75; }
    .spacer { flex: 1; }
    .stamp { opacity: 0.45; text-transform: none; letter-spacing: 0.04em; }
    iframe {
      flex: 1;
      width: 100%;
      border: 0;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="strip">
    <span class="mark">tb</span>
    <span class="live-dot" id="dot"></span>
    <span class="status" id="status">live preview · synced with your editor</span>
    <span class="spacer"></span>
    <span class="stamp" id="stamp"></span>
  </div>
  <iframe id="frame" title="Preview of your page" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>

  <script src="builder.js"></script>
  <script>
    (function () {
      'use strict';
      var frame = document.getElementById('frame');
      var dot = document.getElementById('dot');
      var stamp = document.getElementById('stamp');
      var statusEl = document.getElementById('status');
      var lastT = 0;

      function show(code) {
        if (code.t && code.t <= lastT) return; // already showing this version
        lastT = code.t || Date.now();
        frame.srcdoc = TB.buildDocument(code, { shim: false, title: 'My page' });
        stamp.textContent = 'updated ' + new Date(lastT).toLocaleTimeString();
        dot.classList.remove('pulse');
        void dot.offsetWidth; // restart the pulse animation
        dot.classList.add('pulse');
      }

      function showEmpty() {
        frame.srcdoc = [
          '<!DOCTYPE html><html><head><meta charset="utf-8"><style>',
          'body{font-family:system-ui,sans-serif;display:grid;place-items:center;',
          'min-height:100vh;margin:0;background:#f3edde;color:#20293a;text-align:center}',
          'p{max-width:34ch;line-height:1.6}',
          '</style></head><body><div><h2>Nothing to show yet</h2>',
          '<p>Keep the editor tab open and start typing — your page will appear here instantly.</p>',
          '</div></body></html>'
        ].join('');
        statusEl.textContent = 'waiting for the editor…';
      }

      // 1. Load whatever was last saved
      var saved = null;
      try { saved = JSON.parse(localStorage.getItem(TB.STORAGE_KEY)); } catch (e) { /* ignore */ }
      if (saved && typeof saved.html === 'string') show(saved);
      else showEmpty();

      // 2. Live updates from the editor tab
      if ('BroadcastChannel' in window) {
        new BroadcastChannel(TB.CHANNEL).onmessage = function (e) {
          statusEl.textContent = 'live preview · synced with your editor';
          show(e.data);
        };
      }
      // Fallback (and belt-and-braces): storage events also fire across tabs
      window.addEventListener('storage', function (e) {
        if (e.key !== TB.STORAGE_KEY || !e.newValue) return;
        try {
          statusEl.textContent = 'live preview · synced with your editor';
          show(JSON.parse(e.newValue));
        } catch (err) { /* ignore malformed */ }
      });
    })();
  </script>
</body>
</html>
